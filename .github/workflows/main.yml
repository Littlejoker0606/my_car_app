name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取您的 index.html
        uses: actions/checkout@v4

      - name: 2. 啟動雲端 Java 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 啟動雲端 Gradle 編譯器
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. 自動生成支援「相簿一次多選 + 全透明狀態列 + 熱更新」的 Android 專案
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/collection/vault

          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CollectionVault"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.collection.vault'
              compileSdk 34
              defaultConfig {
                  applicationId "com.collection.vault"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="1
